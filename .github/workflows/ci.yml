name: CI

on:
  push:
    branches: ["**"]
  pull_request:

env:
  DATABASE_URL: postgresql://postgres:postgres@localhost:5432/second_chance_nc?schema=public
  # Needed for the e2e suite's login/demo-reset flow — matches the
  # fallback values already hardcoded in the e2e specs themselves, so
  # this isn't a secret, just a fixed local/CI convention.
  ADMIN_USERNAME: secondchance
  ADMIN_PASSWORD: ci-admin-password
  VOLUNTEER_USERNAME: volunteer
  VOLUNTEER_PASSWORD: ci-volunteer-password
  DEMO_MODE: "true"

jobs:
  lint-test-build:
    name: Typecheck, lint, unit tests, build
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: second_chance_nc
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npx prisma migrate deploy
      # A fresh checkout has no .next/types yet, which is where Next.js's
      # App Router puts ambient types like `LayoutProps`— without this,
      # tsc fails with "Cannot find name 'LayoutProps'" even though the
      # code is correct. `next typegen` generates just the types, no
      # full build, so lint/test can still run before the real build step.
      - run: npx next typegen
      - run: npx tsc --noEmit -p .
      - run: npm run lint
      - run: npm test
      - run: npm run build

  e2e:
    name: Playwright end-to-end suite
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: second_chance_nc
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npx prisma migrate deploy
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
        env:
          CI: "true"
